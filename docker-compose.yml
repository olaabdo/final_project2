services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logsapp
      POSTGRES_PASSWORD: logsapp
      POSTGRES_DB: logsapp
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=off
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - work_mem=32MB
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    cpus: "1"
    mem_limit: "1g"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://logsapp:logsapp@postgres:5432/logsapp
      PORT: 8080
      PG_POOL_MAX: 20
      PG_SYNCHRONOUS_COMMIT: "off"
      RETENTION_DAYS: 30
      RETENTION_INTERVAL_MS: 60000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: "256m"

  loadtest:
    build:
      context: .
      target: loadtest
    profiles: ["loadtest"]
    environment:
      LOADTEST_URL: http://app:8080
      LOADTEST_TOTAL: "1000000"
      LOADTEST_BATCH: "500"
      LOADTEST_CONCURRENCY: "50"
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
